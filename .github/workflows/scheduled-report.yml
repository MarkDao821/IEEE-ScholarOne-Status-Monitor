name: Scheduled ScholarOne Report

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC is 09:00 in Asia/Shanghai.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "30 4 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Create .env
        shell: pwsh
        run: |
          @'
          ${{ secrets.ENV_FILE }}
          '@ | Set-Content -Path .env -Encoding utf8

      - name: Create journals.toml
        shell: pwsh
        run: |
          @'
          ${{ secrets.JOURNALS_TOML }}
          '@ | Set-Content -Path journals.toml -Encoding utf8

      - name: Send scheduled check
        run: python -m ieee_scholarone_monitor check
